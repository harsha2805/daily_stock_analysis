          LLM_MODELFLARE_PROTOCOL: ${{ vars.LLM_MODELFLARE_PROTOCOL || secrets.LLM_MODELFLARE_PROTOCOL }}
          LLM_MODELFLARE_API_SURFACE: ${{ vars.LLM_MODELFLARE_API_SURFACE || secrets.LLM_MODELFLARE_API_SURFACE }}
          LLM_MODELFLARE_BASE_URL: ${{ vars.LLM_MODELFLARE_BASE_URL || secrets.LLM_MODELFLARE_BASE_URL }}
          LLM_MODELFLARE_API_KEY: ${{ secrets.LLM_MODELFLARE_API_KEY }}
          LLM_MODELFLARE_API_KEYS: ${{ secrets.LLM_MODELFLARE_API_KEYS }}
          LLM_MODELFLARE_MODELS: ${{ vars.LLM_MODELFLARE_MODELS || secrets.LLM_MODELFLARE_MODELS }}
          LLM_MODELFLARE_ENABLED: ${{ vars.LLM_MODELFLARE_ENABLED || secrets.LLM_MODELFLARE_ENABLED }}
          LLM_MODELFLARE_EXTRA_HEADERS: ${{ vars.LLM_MODELFLARE_EXTRA_HEADERS || secrets.LLM_MODELFLARE_EXTRA_HEADERS }}
          # Hermes is a local loopback generation preset; its API key only comes from Secrets.
          # 127.0.0.1 on a GitHub-hosted runner is not your computer, so this usually only suits self-hosted runners.
          LLM_HERMES_PROTOCOL: ${{ vars.LLM_HERMES_PROTOCOL || secrets.LLM_HERMES_PROTOCOL }}
          LLM_HERMES_API_SURFACE: ${{ vars.LLM_HERMES_API_SURFACE || secrets.LLM_HERMES_API_SURFACE }}
          LLM_HERMES_BASE_URL: ${{ vars.LLM_HERMES_BASE_URL || secrets.LLM_HERMES_BASE_URL }}
          LLM_HERMES_API_KEY: ${{ secrets.LLM_HERMES_API_KEY }}
          LLM_HERMES_MODELS: ${{ vars.LLM_HERMES_MODELS || secrets.LLM_HERMES_MODELS }}
          LLM_HERMES_ENABLED: ${{ vars.LLM_HERMES_ENABLED || secrets.LLM_HERMES_ENABLED }}

          # Gemini AI (primary)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3-flash-preview' }}
          GEMINI_MODEL_FALLBACK: ${{ vars.GEMINI_MODEL_FALLBACK || secrets.GEMINI_MODEL_FALLBACK || 'gemini-2.5-flash' }}
          GEMINI_REQUEST_DELAY: '3.0'
          
          # AIHubMix (takes precedence over OPENAI_API_KEY and sets base_url automatically)
          AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}

          # OpenAI-compatible API (alternative)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}

          # DeepSeek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEYS: ${{ secrets.DEEPSEEK_API_KEYS }}
          
          # Anthropic / Claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEYS: ${{ secrets.ANTHROPIC_API_KEYS }}
